# WCO — full stack: PostgreSQL, Redis, migrations/seed, API, worker and dashboard.
#
#   docker compose up -d --build        # http://localhost:3000 (dashboard) · http://localhost:4000/api/docs (API)
#   docker compose logs -f api worker
#   docker compose down -v              # removes data volumes
#
# Defaults run in MOCK mode with development fallbacks for secrets (APP_MODE=development).
# For production, set APP_MODE=production and real secrets (or SECRET_PROVIDER=docker with
# infra/docker/compose.secrets.yml) — see docs/DEPLOYMENT.md. Values come from the shell or a .env file.
name: wco

x-app-env: &app-env
  APP_MODE: ${APP_MODE:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://wco:${POSTGRES_PASSWORD:-wco}@postgres:5432/wco
  REDIS_URL: redis://redis:6379
  API_PORT: "4000"
  API_HOST: 0.0.0.0
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
  API_INTERNAL_URL: http://api:4000
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
  CORS_ORIGINS: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
  SECRET_PROVIDER: ${SECRET_PROVIDER:-development}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-}
  HASH_PEPPER: ${HASH_PEPPER:-}
  MOCK_WHATSAPP: ${MOCK_WHATSAPP:-true}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v26.0}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
  META_WABA_ID: ${META_WABA_ID:-}
  META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
  META_PARTNER_TYPE: ${META_PARTNER_TYPE:-}
  META_EMBEDDED_SIGNUP_CONFIG_ID: ${META_EMBEDDED_SIGNUP_CONFIG_ID:-}
  META_ADVANCED_ACCESS_CONFIRMED: ${META_ADVANCED_ACCESS_CONFIRMED:-false}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}

x-build: &build
  context: .
  dockerfile: infra/docker/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wco}
      POSTGRES_DB: wco
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      # TCP check: during first-time init the image runs a temporary socket-only server that
      # would pass a socket check before Postgres accepts network connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wco -d wco"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies Prisma migrations, then seeds demo data when SEED=true (idempotent).
  migrate:
    build: { <<: *build, target: tools }
    image: wco-tools:local
    environment:
      <<: *app-env
      SEED: ${SEED:-true}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  api:
    build: { <<: *build, target: api }
    image: wco-api:local
    environment: *app-env
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { <<: *build, target: worker }
    image: wco-worker:local
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"
    depends_on:
      migrate: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { <<: *build, target: web }
    image: wco-web:local
    environment:
      API_INTERNAL_URL: http://api:4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
