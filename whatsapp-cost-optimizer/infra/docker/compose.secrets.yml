# Production-style secrets with Docker secrets (SECRET_PROVIDER=docker reads /run/secrets/<name>).
#
#   infra/docker/gen-secrets.sh                    # writes infra/docker/secrets/* (gitignored)
#   APP_MODE=production MOCK_WHATSAPP=false META_GRAPH_API_VERSION=v26.0 \
#     docker compose -f docker-compose.yml -f infra/docker/compose.secrets.yml up -d --build
#
# File names are the lower-case secret names (encryption_key, jwt_secret, ...). Nothing secret is
# passed through environment variables in this mode.
x-secret-env: &secret-env
  SECRET_PROVIDER: docker
  SECRETS_DIR: /run/secrets

x-secrets: &secrets
  - encryption_key
  - jwt_secret
  - hash_pepper
  - meta_app_secret
  - meta_webhook_verify_token
  - meta_access_token

services:
  migrate:
    environment: *secret-env
    secrets: *secrets
  api:
    environment: *secret-env
    secrets: *secrets
  worker:
    environment: *secret-env
    secrets: *secrets

secrets:
  encryption_key:
    file: ./infra/docker/secrets/encryption_key
  jwt_secret:
    file: ./infra/docker/secrets/jwt_secret
  hash_pepper:
    file: ./infra/docker/secrets/hash_pepper
  meta_app_secret:
    file: ./infra/docker/secrets/meta_app_secret
  meta_webhook_verify_token:
    file: ./infra/docker/secrets/meta_webhook_verify_token
  meta_access_token:
    file: ./infra/docker/secrets/meta_access_token
