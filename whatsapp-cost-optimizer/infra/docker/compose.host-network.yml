# Host networking — for Docker-in-Docker environments (e.g. GitHub Codespaces) where containers on
# the compose bridge network resolve each other but cannot open TCP connections between them.
#
#   docker compose -f docker-compose.yml -f infra/docker/compose.host-network.yml up -d --build
#
# Every service shares the host network: they talk over localhost and need ports 3000, 4000,
# 5432, 6379 and 9100 free on the host. Published ports are dropped (they do not apply here).
x-host-env: &host-env
  DATABASE_URL: postgresql://wco:${POSTGRES_PASSWORD:-wco}@127.0.0.1:5432/wco
  REDIS_URL: redis://127.0.0.1:6379
  API_INTERNAL_URL: http://127.0.0.1:4000

services:
  postgres:
    network_mode: host
    ports: !reset []
  redis:
    network_mode: host
    ports: !reset []
  migrate:
    network_mode: host
    environment: *host-env
  api:
    network_mode: host
    ports: !reset []
    environment: *host-env
  worker:
    network_mode: host
    environment: *host-env
  web:
    network_mode: host
    ports: !reset []
    environment:
      API_INTERNAL_URL: http://127.0.0.1:4000
